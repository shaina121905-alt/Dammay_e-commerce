    <header class="bg-secondary text-white text-center py-5">
        <div class="container">
            <h1 class="display-5 fw-bold mb-3">Get in Touch</h1>
            <p class="lead mb-0">Have inquiries about product endorsements or student membership? Reach out to us.</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4">
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Your Name</label>
                            <input type="text" class="form-control" placeholder="Juan Dela Cruz" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Subject</label>
                            <input type="text" class="form-control" placeholder="Inquiry about cultural product endorsement" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Message</label>
                            <textarea class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold text-warning">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
